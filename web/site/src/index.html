<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Totality</title>
<link rel="stylesheet" href="/app.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<main class="stage">
  <div class="intro">
    <span class="badge" role="img" aria-label="Totality">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="6" r="3.2"/><circle cx="6.5" cy="10" r="3.2"/><circle cx="17.5" cy="10" r="3.2"/><circle cx="8.5" cy="16.5" r="3.2"/><circle cx="15.5" cy="16.5" r="3.2"/><circle cx="12" cy="12" r="3"/></svg>
    </span>
    <h1>Your Totality, on a bigger screen.</h1>
    <p class="lede">Reader, Mail, Calendar, Messages, Tasks and Photos, with the same account and the same keys as your iPhone.</p>
  </div>
  <form class="card" id="sign-in" autocomplete="on">
    <h2>Sign in</h2>
    <label>Username
      <input name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Sign in</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div class="note">
      <svg width="15" height="15" viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <span>Your password only signs you in.</span>
    </div>
  </form>
</main>
</body>
</html>
