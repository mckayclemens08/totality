# Tuwunel, the Matrix server. See proposal §2 for why this replaced Conduit.
[global]
# Part of every Matrix address, and it can never change.
server_name = "usetotality.com"
database_path = "/var/lib/tuwunel"
address = ["0.0.0.0"]
port = 8008

# Accounts come only from Totality sign-in, once that's wired up. Nobody can register here directly.
allow_registration = false

# Phase 2 is closed, so this server talks to no other Matrix server yet.
allow_federation = false
trusted_servers = []

# Only the tunnel can reach this server, and Cloudflare sets this header itself.
ip_source = "cf_connecting_ip"

log = "warn"

# Accounts are made here from a signed pass that only supabase/functions/matrix-login can issue. This is
# the public half of its key, so it's safe in the repo. The private half is in Supabase's secrets.
[global.jwt]
enable = true
format = "ECDSA"
algorithm = "ES256"
key = """
-----BEGIN PUBLIC KEY-----
MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEOur7osLPr+Aw6UynrG45k6quGhGu
sRGV33+/PfZpss6Y+TpATMJFB+XNrBSGwnvtpGkIHvTpLpLTaOGhgoQnwQ==
-----END PUBLIC KEY-----
"""
register_user = true
audience = ["matrix.usetotality.com"]
issuer = ["totality"]
require_exp = true

[global.well_known]
client = "https://matrix.usetotality.com"
server = "matrix.usetotality.com:443"
