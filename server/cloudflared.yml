# What the tunnel will carry. Everything else gets a 404, including federation, which stays off until
# Phase 2.
tunnel: e4887556-fad1-46ac-b6c4-b1996a4fce65
credentials-file: /etc/cloudflared/credentials.json

ingress:
  - hostname: matrix.usetotality.com
    path: ^/_matrix/(client|media)/
    service: http://tuwunel:8008
  - hostname: usetotality.com
    path: ^/\.well-known/matrix/
    service: http://tuwunel:8008
  # Search, through the gateway. SearXNG itself is never reachable from here.
  - hostname: usetotality.com
    path: ^/web/(search|image)$
    service: http://gateway:8080
  # Mail from Cloudflare's Worker, which has to present a secret, and a device publishing its key,
  # listing, fetching, deleting, and keeping its own sealed mail, or finding another account's key and
  # delivering to it, which has to be signed in. Health stays private.
  - hostname: usetotality.com
    path: ^/mail/(arrive|key|list|delete|deliver|keep|send|recipient/[a-z0-9_]{3,24}|message/[0-9a-f-]{36})$
    service: http://mail:8080
  - service: http_status:404
