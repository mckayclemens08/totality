# What the tunnel will carry. Everything else gets a 404, including federation, which stays off until
# Phase 2.
tunnel: e4887556-fad1-46ac-b6c4-b1996a4fce65
credentials-file: /etc/cloudflared/credentials.json

ingress:
  # Matrix goes through the guard, which checks every invite against "Who can message me".
  - hostname: matrix.usetotality.com
    path: ^/_matrix/(client|media)/
    service: http://matrix-guard:8080
  - hostname: usetotality.com
    path: ^/\.well-known/matrix/
    service: http://tuwunel:8008
  # Search, through the gateway. SearXNG itself is never reachable from here.
  - hostname: usetotality.com
    path: ^/web/(search|image)$
    service: http://gateway:8080
  # Mail from Cloudflare's Worker, which has to present a secret, and a device publishing its key,
  # listing, fetching, deleting, and keeping its own sealed mail, or finding another account's key and
  # delivering to it, which has to be signed in. Health stays private.
  - hostname: usetotality.com
    path: ^/mail/(arrive|key|list|delete|deliver|keep|send|recipient/[a-z0-9_]{3,24}|message/[0-9a-f-]{36})$
    service: http://mail:8080
  # Totality's homepage and privacy policy, both fixed text.
  - hostname: usetotality.com
    path: ^/(privacy)?$
    service: http://profile:8080
  # Public profile pages, which exist only once their owner shares them, and a signed-in device
  # publishing, removing, or checking its own. Health stays private.
  - hostname: usetotality.com
    path: ^/(@[A-Za-z0-9_]{3,24}|profile/(publish|unpublish|mine))$
    service: http://profile:8080
  # The sealed blob store: a signed-in device adding, reading, or removing its own sealed blobs, or
  # asking how much room it has. Health stays private.
  - hostname: usetotality.com
    path: ^/blobs/(usage|list|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$
    service: http://blobs:8080
  # Social's photos and voice clips: a signed-in device reading anyone's by its path, or adding to or
  # removing from its own folder. Health stays private.
  - hostname: usetotality.com
    path: ^/social/media/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    service: http://social-media:8080
  # Push: a signed-in phone registering or removing its push token or linking a Gmail address, and
  # Google's Pub/Sub note that a Gmail inbox changed, which has to carry Google's signature. Health stays
  # private.
  - hostname: usetotality.com
    path: ^/push/(device|device/remove|gmail/link|gmail/unlink|gmail/notify)$
    service: http://push:8080
  - service: http_status:404
