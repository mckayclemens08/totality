# The server plane on the Oracle box. Secrets never live here: anything private stays in files on the
# server that this repo ignores. Tuwunel listens only on the machine itself.
services:
  tuwunel:
    # v1.9.4 for arm64, pinned by digest so an upgrade is always a deliberate change.
    image: ghcr.io/matrix-construct/tuwunel@sha256:0bb78226d66a1cb9c120f741df279cdcc7afa0f9bbcbe4a50f1264c8e73bc36a
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    environment:
      TUWUNEL_CONFIG: /etc/tuwunel.toml
    ports:
      - "127.0.0.1:8008:8008"
    volumes:
      - ./tuwunel.toml:/etc/tuwunel.toml:ro
      - ./data:/var/lib/tuwunel

  # Reaches out to Cloudflare, so the server needs no open ports. credentials.json is the tunnel's
  # secret and exists only on the server.
  cloudflared:
    image: cloudflare/cloudflared@sha256:17ab7aa52b3a9805b36c81cbe353bad657fb6395d63c81e12021beaea95f03d3
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    depends_on: [tuwunel, gateway, mail]
    volumes:
      - ./cloudflared.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro

  # The only way in to search. It checks a Totality sign-in and logs nothing about what was searched.
  # .env exists only on the server, and each service is handed just the values it needs.
  gateway:
    image: python:3.13-alpine@sha256:7984cf56ceaddebe4fefeb75d64000b9f45d8b77b11a09b24524da6cdc3af0c8
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?}
      SEARXNG_SECRET: ${SEARXNG_SECRET:?}
      PYTHONDONTWRITEBYTECODE: "1"
    command: python /app/gateway.py
    depends_on: [searxng]
    networks: [default, search]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as r; r.urlopen('http://127.0.0.1:8080/web/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./gateway/gateway.py:/app/gateway.py:ro

  # Asks the search engines. It has no published port and shares a network only with the gateway, so
  # it can't reach Tuwunel. Its logging is off because a failed engine logs the address it tried, and
  # that address has the search in it.
  searxng:
    image: searxng/searxng@sha256:2d8d40c0d69d8b458d394701d284ccb052b25a19c18c930d8920296953caafe2
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?}
    logging:
      driver: none
    networks: [search]
    volumes:
      - ./searxng.yml:/etc/searxng/settings.yml:ro

  # Takes mail from Cloudflare's Worker and seals it before anything reaches the disk. Outside mail is
  # readable here for a moment, so nothing it does is logged, it has no swap, and a crash can't leave a
  # core file. The core limit is 1 and not 0 on purpose, here and on rspamd: this host pipes crashes to
  # Ubuntu's crash reporter, which a limit of 0 doesn't stop. A 2026-11-02 test crash wrote a report to
  # /var/crash with a limit of 0 and nothing with a limit of 1, which the kernel treats as no dump.
  mail:
    image: node:24-alpine@sha256:e643984449ad25c88c0ff45094c74916806c9ee9dd1bc26c3593686ba2b853e4
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    memswap_limit: 512m
    ulimits:
      core: 1
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?}
      MAIL_ARRIVAL_SECRET: ${MAIL_ARRIVAL_SECRET:?}
      # Outside sending stays off until both are set in .env.
      MAIL_SEND_URL: ${MAIL_SEND_URL:-}
      MAIL_SEND_SECRET: ${MAIL_SEND_SECRET:-}
    command: node /app/mail.mjs
    depends_on: [rspamd]
    networks: [default, spam]
    logging:
      driver: none
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/mail/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./mail/mail.mjs:/app/mail.mjs:ro
      - ./mailboxes:/var/lib/totality-mail

  # The spam check. Its network has no way out, so nothing about a message can leave this server, and
  # everything it writes stays in memory. That means no blocklists, so it judges by content alone.
  # v4.2.3 for arm64, pinned by digest.
  rspamd:
    image: rspamd/rspamd@sha256:c2d5de2f2183d511ce398141ee95ae2d2919064040d37dc874c591cd246f2ca6
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    memswap_limit: 512m
    ulimits:
      core: 1
    tmpfs:
      - /tmp
      - /var/lib/rspamd:uid=11333,gid=11333
      - /run/rspamd:uid=11333,gid=11333
    logging:
      driver: none
    networks: [spam]
    # The image's own check asks the controller, which is off, so this asks the port mail uses.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/11333 && printf 'GET /ping HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q pong <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./rspamd:/etc/rspamd/local.d:ro

networks:
  search:
  spam:
    internal: true
