name: backend
on:
  pull_request:
  push:
    branches: [main]
jobs:
  two-user-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend-tests/package-lock.json
      - run: npm ci
      - run: npm test
