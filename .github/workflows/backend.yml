name: backend
on:
  pull_request:
  push:
    branches: [main]
jobs:
  two-user-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend-tests/package-lock.json
      - run: npm ci
      - run: npm test
  gateway-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest -v test_gateway
  mail-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/mail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test mail.test.mjs
  profile-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/profile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test profile.test.mjs
